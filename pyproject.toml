[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luminark-guardian"
version = "1.0.0"
description = "Experimental heuristic text-auditing prototype with rule-based scoring and rewrite suggestions"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai-safety-prototype", "rule-based-auditing", "keyword-heuristics", "text-analysis", "ai-assisted-writing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.0",
    "hiredis>=2.3.0",
    "slowapi>=0.1.9",
    "structlog>=24.1.0",
    "prometheus-fastapi-instrumentator>=0.9.0",
]

[project.scripts]
luminark = "luminark.__main__:main"
luminark-api = "api.main:run"

[project.urls]
Homepage = "https://github.com/foreverforward760-crypto/luminark-guardian"
Repository = "https://github.com/foreverforward760-crypto/luminark-guardian"
Issues = "https://github.com/foreverforward760-crypto/luminark-guardian/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["luminark*", "api*", "dashboard*"]
